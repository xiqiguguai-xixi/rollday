<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>RollDay · 骰子日程</title>

<!-- PWA -->
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="RollDay">

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:#f5f6f8;color:#1a1d23;min-height:100vh;overscroll-behavior-y:none;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
}
.app{max-width:480px;margin:0 auto;padding-bottom:88px}

/* ---------- 顶栏 ---------- */
.topbar{
  position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;
  padding:14px 16px 12px;background:rgba(255,255,255,.9);backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid #e8eaee;
}
.logo{font-weight:800;letter-spacing:.5px;font-size:15px;color:#1a1d23}
.score{font-size:26px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1;transition:color .2s;color:#1a1d23}
.score.pos{color:#10b981}
.score.neg{color:#ef4444}
.score-sub{font-size:11px;color:#9ca3af;text-align:right;margin-top:4px}

/* ---------- 卡片 ---------- */
.card{
  background:#fff;border:1px solid #e8eaee;border-radius:16px;padding:16px;
  margin:0 12px 12px;box-shadow:0 1px 2px rgba(15,23,42,.03);
}
.card-title{font-size:12px;color:#6b7280;margin-bottom:12px;font-weight:700;letter-spacing:.5px}
.dim{color:#9ca3af}
.sub{font-size:12px}
.center{text-align:center}

/* ---------- 优先级颜色 ---------- */
.pri-3{color:#e5484d}  /* 高 */
.pri-2{color:#f59e0b}  /* 中 */
.pri-1{color:#3b82f6}  /* 低 */

/* ---------- 复选框 ---------- */
.check{
  width:22px;height:22px;flex:none;border-radius:6px;border:2px solid #d1d5db;
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  transition:.15s;background:#fff;padding:0;margin:0;
  -webkit-appearance:none;appearance:none;
}
.check:active{transform:scale(.92)}
.check.checked{
  background:linear-gradient(135deg,#5b7cfa,#7c5bfa);
  border-color:transparent;
}
.check.checked::after{
  content:'';width:10px;height:6px;
  border-left:2px solid #fff;border-bottom:2px solid #fff;
  transform:rotate(-45deg) translate(1px,-2px);
}

/* ---------- 拖拽手柄 ---------- */
.drag-handle{
  width:22px;height:22px;flex:none;border:none;background:transparent;
  color:#cbd0d8;cursor:grab;padding:0;display:flex;align-items:center;justify-content:center;
  touch-action:none;transition:color .15s;
  -webkit-appearance:none;appearance:none;
}
.drag-handle:hover{color:#9ca3af}
.drag-handle:active{cursor:grabbing;color:#5b7cfa}

/* ---------- 倒计时 ---------- */
.cd{
  font-weight:700;font-variant-numeric:tabular-nums;font-size:11px;
  display:inline-flex;align-items:center;gap:3px;
}
.cd.fresh{color:#10b981}
.cd.soon{color:#f59e0b}
.cd.urgent{color:#ef4444}
.cd.expired{color:#b91c1c;background:#fef2f2;padding:1px 6px;border-radius:99px}
.cd::before{content:'⏱';font-size:10px;opacity:.8}

/* ---------- 当前任务卡 ---------- */
.current{text-align:center;padding:22px 16px}
.current-tag{font-size:11px;color:#5b7cfa;letter-spacing:3px;font-weight:800}
.current-tag.grey{color:#9ca3af}
.current-title{font-size:20px;font-weight:800;margin:10px 0 4px;word-break:break-word;line-height:1.3;color:#1a1d23}
.timer{font-size:46px;font-weight:900;font-variant-numeric:tabular-nums;margin:10px 0;letter-spacing:1px;line-height:1;color:#1a1d23}
.timer.overtime{color:#f59e0b}
.bar{height:6px;background:#eef0f4;border-radius:99px;overflow:hidden;margin:14px 0 8px}
.bar-fill{height:100%;background:linear-gradient(90deg,#5b7cfa,#7c5bfa);border-radius:99px;transition:width .4s linear}
.empty{padding:36px 16px;text-align:center}
.big-emoji{font-size:48px;margin-bottom:10px}
.empty-title{font-size:17px;font-weight:700;margin-bottom:6px;color:#1a1d23}

/* ---------- 按钮 ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;border:none;border-radius:12px;
  padding:12px 16px;font-size:15px;font-weight:700;cursor:pointer;background:#f3f4f6;color:#374151;
  transition:transform .08s,opacity .15s,background .15s;font-family:inherit;
}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.4;cursor:default}
.btn.primary{
  background:linear-gradient(135deg,#5b7cfa,#7c5bfa);color:#fff;
  box-shadow:0 6px 20px -6px rgba(92,124,250,.5);
}
.btn.ghost{background:#f3f4f6;border:1px solid #e5e7eb;color:#374151}
.btn.danger{background:#fef2f2;color:#dc2626;border:1px solid #fecaca}
.btn.big{width:100%;padding:16px;font-size:16px;margin-top:14px}
.btn.text{background:transparent;color:#9ca3af;font-size:13px;width:100%;margin-top:8px}
.btn.small{padding:9px 12px;font-size:13px}
.row{display:flex;gap:8px;align-items:center}
.row.gap{gap:10px;margin-top:12px}
.row>.btn{flex:1}
.icon-btn{
  background:none;border:none;color:#b0b5bd;font-size:18px;cursor:pointer;
  padding:4px 8px;line-height:1;font-family:inherit;border-radius:8px;
  transition:.15s;flex:none;-webkit-appearance:none;appearance:none;
}
.icon-btn:hover{background:#f3f4f6;color:#5b7cfa}
.icon-btn:active{color:#5b7cfa;background:#f3f4f6}
.icon-btn.del:hover,.icon-btn.del:active{color:#ef4444;background:#fef2f2}

/* ---------- 任务池任务项 ---------- */
.task-item{
  display:flex;align-items:center;gap:8px;
  padding:10px 0 10px 8px;
  border-bottom:1px solid #f3f4f6;
  border-left:3px solid transparent;
  position:relative;
  transition:opacity .15s;
}
.task-item:last-child{border-bottom:none}
.task-item.pri-3{border-left-color:#e5484d}
.task-item.pri-2{border-left-color:#f59e0b}
.task-item.pri-1{border-left-color:#3b82f6}
.task-item.done .task-title{text-decoration:line-through;color:#9ca3af}
.task-item.done{opacity:.55}
.task-item.dragging{
  opacity:.95;
  background:#fff;
  box-shadow:0 8px 24px rgba(15,23,42,.12),0 0 0 1px #e8eaee;
  border-radius:12px;
  cursor:grabbing;
}
.task-main{flex:1;min-width:0}
.task-title{font-size:15px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#1a1d23}
.task-meta{font-size:11px;margin-top:3px;color:#9ca3af;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.task-actions{display:flex;gap:2px;flex:none}

/* ---------- 拖拽指示线 ---------- */
.drag-indicator{
  position:absolute;left:8px;right:0;height:2px;
  background:#5b7cfa;border-radius:2px;
  pointer-events:none;z-index:60;
  box-shadow:0 0 0 3px rgba(91,124,250,.12);
}
.drag-indicator::before,.drag-indicator::after{
  content:'';position:absolute;top:50%;width:6px;height:6px;
  background:#5b7cfa;border-radius:50%;transform:translateY(-50%);
}
.drag-indicator::before{left:-3px}
.drag-indicator::after{right:-3px}

/* ---------- 队列（每日日程） ---------- */
.queue{display:flex;flex-direction:column}
.queue-item{
  display:flex;align-items:center;gap:10px;
  padding:10px 0 10px 10px;
  border-bottom:1px solid #f3f4f6;
  border-left:3px solid transparent;
}
.queue-item:last-child{border-bottom:none}
.queue-item.pri-3{border-left-color:#e5484d}
.queue-item.pri-2{border-left-color:#f59e0b}
.queue-item.pri-1{border-left-color:#3b82f6}
.queue-item.done{opacity:.45}
.queue-item.done .q-title{text-decoration:line-through}
.q-title{flex:1;font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#1a1d23}
.q-meta{font-size:12px;color:#5b7cfa;font-variant-numeric:tabular-nums;white-space:nowrap;flex:none}

/* ---------- 输入 ---------- */
.input{
  width:100%;background:#f9fafb;border:1px solid #e5e7eb;color:#1a1d23;border-radius:10px;
  padding:12px;font-size:16px;font-family:inherit;margin-bottom:8px;
  transition:border-color .15s,background .15s;
}
.input:focus{outline:none;border-color:#5b7cfa;background:#fff}
.input::placeholder{color:#9ca3af}
select.input{appearance:none;-webkit-appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,#9ca3af 50%),linear-gradient(135deg,#9ca3af 50%,transparent 50%);
  background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;
  background-size:5px 5px;background-repeat:no-repeat;
  background-color:#f9fafb;
}
select.input:focus{background-color:#fff}
.mini-label{font-size:11px;color:#9ca3af;white-space:nowrap}

/* ---------- 记录 ---------- */
.roll-item{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #f3f4f6;font-size:13px}
.roll-item:last-child{border-bottom:none}
.roll-time{font-size:11px;width:38px;flex:none;font-variant-numeric:tabular-nums;color:#9ca3af}
.roll-label{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#374151}
.roll-val{font-weight:800;font-variant-numeric:tabular-nums}
.pos{color:#10b981}
.neg{color:#ef4444}

/* ---------- 图表 ---------- */
.chart{display:flex;align-items:flex-end;justify-content:space-between;height:120px;gap:6px}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;height:100%}
.bar-val{font-size:10px;height:14px;color:#9ca3af;font-variant-numeric:tabular-nums}
.bar-track{flex:1;width:100%;display:flex;align-items:flex-end}
.bar-fill-v{width:100%;border-radius:6px 6px 3px 3px;min-height:3px;transition:height .3s}
.bar-fill-v.pos{background:linear-gradient(180deg,#34d399,#10b981)}
.bar-fill-v.neg{background:linear-gradient(180deg,#f87171,#ef4444)}
.bar-label{font-size:10px;margin-top:6px;color:#9ca3af}

/* ---------- 设置 ---------- */
.setting-row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 0;font-size:14px;border-bottom:1px solid #f3f4f6;color:#374151}
.setting-row:last-child{border-bottom:none}
.setting-row input[type=number],.setting-row input[type=time]{
  background:#f9fafb;border:1px solid #e5e7eb;color:#1a1d23;border-radius:8px;
  padding:7px 9px;font-size:15px;width:78px;text-align:center;font-family:inherit;
}
.setting-row input[type=time]{width:104px}
.setting-row input:focus{outline:none;border-color:#5b7cfa;background:#fff}
.setting-row input[type=checkbox]{width:20px;height:20px;accent-color:#5b7cfa}

/* ---------- Tabbar ---------- */
.tabbar{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;
  display:flex;z-index:50;background:rgba(255,255,255,.95);backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  border-top:1px solid #e8eaee;padding:6px 0 max(6px,env(safe-area-inset-bottom));
}
.tabbar button{
  flex:1;background:none;border:none;color:#9ca3af;font-size:11px;padding:8px 0;cursor:pointer;
  font-family:inherit;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:3px;
  transition:color .15s;
}
.tabbar button .tb-ico{font-size:18px;line-height:1}
.tabbar button.active{color:#5b7cfa}

/* ---------- 视图 ---------- */
.view{display:none}
.view.active{display:block;animation:fade .18s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---------- Toast ---------- */
#toast{
  position:fixed;left:50%;bottom:104px;transform:translate(-50%,12px);
  background:rgba(31,41,55,.95);color:#fff;padding:11px 20px;border-radius:99px;
  font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:100;
  white-space:nowrap;max-width:88vw;overflow:hidden;
  text-overflow:ellipsis;font-weight:600;
  box-shadow:0 8px 24px rgba(15,23,42,.2);
}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- Roll 闪光 ---------- */
.roll-flash{
  position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  z-index:200;pointer-events:none;opacity:0;transform:scale(.8);transition:opacity .2s,transform .2s;
  background:rgba(255,255,255,.72);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
}
.roll-flash.show{opacity:1;transform:scale(1)}
.rf-num{font-size:80px;font-weight:900;letter-spacing:-3px;line-height:1;font-variant-numeric:tabular-nums}
.roll-flash.pos .rf-num{color:#10b981;text-shadow:0 0 50px rgba(16,185,129,.35)}
.roll-flash.neg .rf-num{color:#ef4444;text-shadow:0 0 50px rgba(239,68,68,.35)}
.rf-txt{font-size:14px;color:#6b7280;margin-top:10px;font-weight:600}

/* ---------- 弹窗 ---------- */
.modal-mask{
  position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:center;
  justify-content:center;z-index:300;padding:24px;backdrop-filter:blur(4px);
  -webkit-backdrop-filter:blur(4px);
  animation:fade .15s ease;
}
.modal{
  background:#fff;border:1px solid #e8eaee;border-radius:22px;padding:24px 22px;
  width:100%;max-width:340px;text-align:center;
  box-shadow:0 30px 80px -20px rgba(15,23,42,.3);
}
.modal-tag{font-size:11px;color:#9ca3af;letter-spacing:3px;font-weight:800}
.modal-big{font-size:62px;font-weight:900;margin:14px 0 4px;color:#5b7cfa;font-variant-numeric:tabular-nums;line-height:1}
.modal-big .unit{font-size:17px;font-weight:700;color:#9ca3af;margin-left:6px}
.modal-label{font-size:11px;color:#6b7280;text-align:left;margin:8px 0 4px;font-weight:600;letter-spacing:.5px}
</style>
</head>
<body>

<div class="app">
  <header class="topbar">
    <div class="logo">🎲 RollDay</div>
    <div>
      <div class="score" id="scoreVal">0</div>
      <div class="score-sub" id="scoreSub">今日分</div>
    </div>
  </header>

  <main>
    <!-- ============ 今日 ============ -->
    <section id="view-today" class="view active">
      <div id="todayContent"></div>
    </section>

    <!-- ============ 任务池 ============ -->
    <section id="view-tasks" class="view">
      <div class="card">
        <div class="card-title">添加任务</div>
        <input id="taskTitle" class="input" placeholder="任务名称，例如：写论文" maxlength="30">
        <div class="row">
          <select id="taskCat" class="input" style="flex:1">
            <option value="脑力">脑力</option>
            <option value="体力">体力</option>
            <option value="创意">创意</option>
            <option value="杂事">杂事</option>
            <option value="社交">社交</option>
          </select>
          <select id="taskPri" class="input" style="flex:1">
            <option value="3">高优先</option>
            <option value="2" selected>中优先</option>
            <option value="1">低优先</option>
          </select>
        </div>
        <div class="row" style="gap:6px">
          <span class="mini-label">最短</span>
          <input id="taskMin" class="input" type="number" value="5" min="1" max="600" style="flex:1;margin:0">
          <span class="mini-label">最长</span>
          <input id="taskMax" class="input" type="number" value="60" min="1" max="600" style="flex:1;margin:0">
          <span class="mini-label">分钟</span>
        </div>
        <button id="btnAddTask" class="btn primary" style="width:100%;margin-top:12px">添加任务</button>
        <div class="sub dim" style="margin-top:8px;text-align:center">
          每个任务从创建开始计时，72 小时内完成
        </div>
      </div>

      <div class="card">
        <div class="card-title">进行中 <span id="taskActiveCount" class="dim"></span> · 按住 ⠿ 拖动排序</div>
        <div id="taskListActive"></div>
      </div>

      <div class="card" id="taskDoneCard" style="display:none">
        <div class="card-title">已完成 <span id="taskDoneCount" class="dim"></span></div>
        <div id="taskListDone"></div>
      </div>
    </section>

    <!-- ============ 记录 ============ -->
    <section id="view-log" class="view">
      <div class="card">
        <div class="card-title">近 7 天得分</div>
        <div id="weekChart" class="chart"></div>
      </div>
      <div class="card">
        <div class="card-title">今日流水</div>
        <div id="rollList"></div>
      </div>
    </section>

    <!-- ============ 设置 ============ -->
    <section id="view-settings" class="view">
      <div class="card">
        <div class="card-title">随机范围</div>
        <div class="setting-row"><span>工作块时长(分)</span>
          <div class="row" style="gap:6px">
            <input type="number" id="setWorkMin" min="1"><span class="dim">~</span><input type="number" id="setWorkMax" min="1">
          </div>
        </div>
        <div class="setting-row"><span>启动分</span>
          <div class="row" style="gap:6px">
            <input type="number" id="setStartMin"><span class="dim">~</span><input type="number" id="setStartMax">
          </div>
        </div>
        <div class="setting-row"><span>完成分</span>
          <div class="row" style="gap:6px">
            <input type="number" id="setEndMin"><span class="dim">~</span><input type="number" id="setEndMax">
          </div>
        </div>
        <div class="setting-row"><span>作息奖励分</span>
          <div class="row" style="gap:6px">
            <input type="number" id="setGoodMin"><span class="dim">~</span><input type="number" id="setGoodMax">
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card-title">负分机制</div>
        <div class="setting-row"><span>启用负分</span><input type="checkbox" id="setNegEnabled"></div>
        <div class="setting-row"><span>每日负分上限</span><input type="number" id="setNegCap" min="0"></div>
        <div class="setting-row"><span>每日重摇次数</span><input type="number" id="setReroll" min="0"></div>
      </div>

      <div class="card">
        <div class="card-title">作息目标</div>
        <div class="setting-row"><span>起床目标</span><input type="time" id="setWake"></div>
        <div class="setting-row"><span>入睡目标</span><input type="time" id="setSleep"></div>
      </div>

      <div class="card">
        <div class="card-title">数据</div>
        <button class="btn ghost" id="btnExport" style="width:100%">导出数据 (JSON)</button>
        <button class="btn danger" id="btnReset" style="width:100%;margin-top:8px">清空全部数据</button>
        <div class="sub dim" style="margin-top:12px;line-height:1.6">
          分数只是启动器，不是自我价值。<br>
          数据全部保存在本机浏览器，不会上传。
        </div>
      </div>
    </section>
  </main>

  <nav class="tabbar">
    <button data-view="today" class="active"><span class="tb-ico">🎲</span>今日</button>
    <button data-view="tasks"><span class="tb-ico">📋</span>任务池</button>
    <button data-view="log"><span class="tb-ico">📈</span>记录</button>
    <button data-view="settings"><span class="tb-ico">⚙️</span>设置</button>
  </nav>
</div>

<script>
/* =========================================================
   RollDay · 骰子日程
   ========================================================= */

/* ---------- 工具函数 ---------- */
const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
const pad = n => String(n).padStart(2, '0');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
  ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const signed = n => (n > 0 ? '+' + n : String(n));
const randInt = (min, max) => {
  min = Math.ceil(min); max = Math.floor(max);
  if (max < min) max = min;
  return Math.floor(Math.random() * (max - min + 1)) + min;
};
const dateKey = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const todayKey = () => dateKey(new Date());
const fmtClock = ts => { const d = new Date(ts); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const fmtTimer = sec => {
  const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
  return h ? `${h}:${pad(m)}:${pad(s)}` : `${pad(m)}:${pad(s)}`;
};

/* ---------- 常量 ---------- */
const STORAGE_KEY = 'rollday.v2';
const OLD_STORAGE_KEY = 'rollday.v1';
const CATEGORIES = ['脑力', '体力', '创意', '杂事', '社交'];
const PRIORITY_NAME = { 1: '低', 2: '中', 3: '高' };
const COUNTDOWN_MS = 72 * 3600 * 1000;   // 72 小时

const DEFAULT_SETTINGS = {
  workMin: 5,        workMax: 60,
  startRollMin: 1,   startRollMax: 50,
  endRollMin: 1,     endRollMax: 50,
  goodSleepMin: 100, goodSleepMax: 300,
  badSleepMin: 1,    badSleepMax: 100,
  enableNegative: true,
  negativeDailyCap: 200,
  rerollLimit: 3,
  wakeTarget: '07:00',
  sleepTarget: '23:00',
};

/* ---------- 状态 ---------- */
let state = loadState();

function loadState() {
  try {
    // 优先读新 key，如果没读到就尝试从旧 key 迁移
    let raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) {
      const oldRaw = localStorage.getItem(OLD_STORAGE_KEY);
      if (oldRaw) {
        raw = oldRaw;
        // 迁移完成后不再用旧 key
        localStorage.removeItem(OLD_STORAGE_KEY);
      }
    }
    if (raw) {
      const s = JSON.parse(raw);
      s.settings = { ...DEFAULT_SETTINGS, ...(s.settings || {}) };
      s.tasks = Array.isArray(s.tasks) ? s.tasks : [];
      s.days = s.days && typeof s.days === 'object' ? s.days : {};
      // 补齐字段
      const now = Date.now();
      s.tasks.forEach(t => {
        if (typeof t.done !== 'boolean') t.done = false;
        if (!t.priority) t.priority = 2;
        if (!t.minDur) t.minDur = 5;
        if (!t.maxDur) t.maxDur = 60;
        if (!t.category) t.category = '脑力';
        if (!t.createdAt) t.createdAt = now;   // 老任务从现在开始计时
      });
      return s;
    }
  } catch (e) { console.warn('[RollDay] load failed', e); }
  return { settings: { ...DEFAULT_SETTINGS }, tasks: [], days: {} };
}

let saveTimer = null;
function save() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
    catch (e) { console.warn('[RollDay] save failed', e); }
  }, 60);
}

function getDay(key = todayKey()) {
  let d = state.days[key];
  if (!d) {
    d = state.days[key] = { blocks: [], rolls: [], rerolls: 0, sleep: { wake: null, sleep: null } };
  }
  d.blocks  = Array.isArray(d.blocks) ? d.blocks : (d.blocks = []);
  d.rolls   = Array.isArray(d.rolls)  ? d.rolls  : (d.rolls  = []);
  d.rerolls = d.rerolls || 0;
  d.sleep   = d.sleep || (d.sleep = { wake: null, sleep: null });
  return d;
}

/* ---------- 分数 ---------- */
function calcScore(day) {
  const st = state.settings;
  let pos = 0, neg = 0;
  for (const r of day.rolls) {
    if (r.value >= 0) pos += r.value;
    else neg += -r.value;
  }
  if (!st.enableNegative) neg = 0;
  else neg = Math.min(neg, st.negativeDailyCap);
  return pos - neg;
}

function pushRoll(type, value, label) {
  const day = getDay();
  day.rolls.push({ id: uid(), type, value, label, at: Date.now() });
  save();
}

/* ---------- 连续天数 ---------- */
function streak() {
  const today = getDay();
  let n = 0;
  const d = new Date();
  if (!today.blocks.some(b => b.status === 'done')) d.setDate(d.getDate() - 1);
  for (let i = 0; i < 3650; i++) {
    const day = state.days[dateKey(d)];
    if (day && day.blocks.some(b => b.status === 'done')) {
      n++; d.setDate(d.getDate() - 1);
    } else break;
  }
  return n;
}

/* ---------- 72h 倒计时 ---------- */
function formatCountdown(task) {
  if (!task.createdAt) return null;
  const deadline = task.createdAt + COUNTDOWN_MS;
  const left = deadline - Date.now();
  const absLeft = Math.abs(left);
  const totalMin = Math.floor(absLeft / 60000);
  const totalHour = Math.floor(absLeft / 3600000);

  let text, cls;

  if (left < 0) {
    cls = 'expired';
    if (totalHour >= 24) {
      text = `超时 ${Math.floor(totalHour / 24)}天${totalHour % 24}时`;
    } else if (totalHour >= 1) {
      text = `超时 ${totalHour}时${totalMin % 60}分`;
    } else {
      text = `超时 ${totalMin}分`;
    }
  } else {
    if (totalHour >= 24) {
      text = `剩 ${Math.floor(totalHour / 24)}天${totalHour % 24}时`;
    } else if (totalHour >= 1) {
      text = `剩 ${totalHour}时${totalMin % 60}分`;
    } else {
      text = `剩 ${totalMin}分`;
    }

    if (left < 24 * 3600 * 1000) cls = 'urgent';
    else if (left < 48 * 3600 * 1000) cls = 'soon';
    else cls = 'fresh';
  }

  return { text, cls };
}

/* =========================================================
   渲染
   ========================================================= */
function render() {
  renderHeader();
  renderToday();
  renderTasks();
  renderLog();
  if (getDay().blocks.some(b => b.status === 'active')) startTick();
}

function renderHeader() {
  const day = getDay();
  const score = calcScore(day);
  const el = $('#scoreVal');
  el.textContent = (score > 0 ? '+' : '') + score;
  el.className = 'score ' + (score > 0 ? 'pos' : score < 0 ? 'neg' : '');
  const s = streak();
  $('#scoreSub').textContent = s > 0 ? `今日分 · 连续 ${s} 天` : '今日分';
}

/* ---------- 今日视图 ---------- */
function renderToday() {
  const day = getDay();
  const active  = day.blocks.find(b => b.status === 'active');
  const pending = day.blocks.filter(b => b.status === 'pending');
  const done    = day.blocks.filter(b => b.status === 'done');

  let html = '';

  if (active) {
    const sec  = Math.floor((Date.now() - active.actualStart) / 1000);
    const pct  = Math.min(100, (sec / 60) / active.plannedMin * 100);
    const over = sec / 60 >= active.plannedMin;
    const pri  = active.priority || 2;
    html += `
      <div class="card current">
        <div class="current-tag">进 行 中</div>
        <div class="current-title">${esc(active.title)}</div>
        <div class="sub dim">
          <span class="pri-${pri}">${PRIORITY_NAME[pri]}优先</span>
          · 计划 ${active.plannedMin} 分钟 · 启动分 ${signed(active.startRoll || 0)}
        </div>
        <div class="timer ${over ? 'overtime' : ''}" id="liveTimer">${fmtTimer(sec)}</div>
        <div class="bar"><div class="bar-fill" id="liveBar" style="width:${pct}%"></div></div>
        <div class="row gap">
          <button class="btn primary" data-act="end" data-id="${active.id}">结束 · Roll 完成分</button>
          <button class="btn ghost small" style="flex:0 0 auto" data-act="abort" data-id="${active.id}">放弃</button>
        </div>
      </div>`;
  } else if (pending.length) {
    const next = pending[0];
    const pri = next.priority || 2;
    html += `
      <div class="card current">
        <div class="current-tag grey">下 一 个</div>
        <div class="current-title">${esc(next.title)}</div>
        <div class="sub dim">
          <span class="pri-${pri}">${PRIORITY_NAME[pri]}优先</span>
          · ${esc(next.category)} · 预计 ${next.plannedMin} 分钟
        </div>
        <button class="btn primary big" data-act="start" data-id="${next.id}">▶ 开始（立即 Roll 启动分）</button>
      </div>`;
  } else {
    html += `
      <div class="card empty">
        <div class="big-emoji">🎲</div>
        <div class="empty-title">今天还没有日程</div>
        <div class="sub dim" style="margin-top:6px">生成一串随机任务块，或者随时 Roll 一个时长</div>
      </div>`;
  }

  const rest = day.blocks.filter(b => b.status !== 'active');
  if (rest.length) {
    const doneCount = rest.filter(b => b.status === 'done').length;
    html += `<div class="card">
      <div class="card-title">任务队列 · ${doneCount}/${rest.length} 完成</div>
      <div class="queue">`;
    for (const b of rest) {
      const isDone = b.status === 'done';
      const pri = b.priority || 2;
      html += `<div class="queue-item pri-${pri} ${isDone ? 'done' : ''}">
        <button class="check ${isDone ? 'checked' : ''}" data-toggle-block="${b.id}" aria-label="完成"></button>
        <span class="q-title">${esc(b.title)}</span>
        <span class="q-meta">${b.plannedMin}min</span>
        <button class="icon-btn del" data-act="del" data-id="${b.id}">×</button>
      </div>`;
    }
    html += `</div></div>`;
  }

  html += `
    <div class="card actions-card">
      <button class="btn ghost" style="width:100%" data-act="generate">🎲 生成今日日程（6 个随机块）</button>
      <button class="btn ghost" style="width:100%;margin-top:8px" data-act="rollDur">⏱ 随时 Roll 工作时长</button>
    </div>`;

  html += renderHabitCard(day);

  $('#todayContent').innerHTML = html;
}

function renderHabitCard(day) {
  const st = state.settings;
  const w = day.sleep.wake, s = day.sleep.sleep;
  return `
    <div class="card">
      <div class="card-title">作息打卡</div>
      <div class="row gap" style="margin-top:0">
        <button class="btn ${w ? 'ghost' : 'primary'}" data-act="habitWake" ${w ? 'disabled' : ''}>
          ${w ? `☀ ${fmtClock(w.at)} · ${signed(w.value)}` : '☀ 起床打卡'}
        </button>
        <button class="btn ${s ? 'ghost' : 'primary'}" data-act="habitSleep" ${s ? 'disabled' : ''}>
          ${s ? `🌙 ${fmtClock(s.at)} · ${signed(s.value)}` : '🌙 入睡打卡'}
        </button>
      </div>
      <div class="sub dim" style="margin-top:10px;text-align:center">
        目标 ${st.wakeTarget} 起 · ${st.sleepTarget} 睡
      </div>
    </div>`;
}

/* ---------- 任务池 ---------- */
function renderTasks() {
  const active = state.tasks.filter(t => !t.done);
  const done   = state.tasks.filter(t => t.done);

  $('#taskActiveCount').textContent = active.length ? `(${active.length})` : '';
  $('#taskDoneCount').textContent   = done.length   ? `(${done.length})`   : '';

  const activeEl = $('#taskListActive');
  activeEl.innerHTML = active.length
    ? active.map(taskItemHTML).join('')
    : `<div class="dim center" style="padding:20px 0;font-size:13px">还没有进行中的任务，在上面加一个吧 👆</div>`;

  const doneCard = $('#taskDoneCard');
  if (done.length) {
    doneCard.style.display = '';
    $('#taskListDone').innerHTML = done.map(taskItemHTML).join('');
  } else {
    doneCard.style.display = 'none';
  }
}

function taskItemHTML(t, showDrag = true) {
  const pri = t.priority || 2;
  const cd = formatCountdown(t);
  const cdHTML = cd
    ? `<span class="cd ${cd.cls}" data-countdown="${t.id}">${cd.text}</span>`
    : '';

  const dragHandle = (!t.done && showDrag)
    ? `<button class="drag-handle" data-drag-handle aria-label="拖动排序">
         <svg width="14" height="14" viewBox="0 0 14 14" fill="currentColor" aria-hidden="true">
           <circle cx="4" cy="3" r="1.1"/>
           <circle cx="10" cy="3" r="1.1"/>
           <circle cx="4" cy="7" r="1.1"/>
           <circle cx="10" cy="7" r="1.1"/>
           <circle cx="4" cy="11" r="1.1"/>
           <circle cx="10" cy="11" r="1.1"/>
         </svg>
       </button>`
    : '';

  return `
    <div class="task-item pri-${pri} ${t.done ? 'done' : ''}" data-task-id="${t.id}">
      <button class="check ${t.done ? 'checked' : ''}" data-toggle-task="${t.id}" aria-label="完成"></button>
      ${dragHandle}
      <div class="task-main">
        <div class="task-title">${esc(t.title)}</div>
        <div class="task-meta">
          <span class="pri-${pri}">${PRIORITY_NAME[pri]}优先</span>
          · ${esc(t.category)} · ${t.minDur}~${t.maxDur} 分
          ${cdHTML ? ' · ' + cdHTML : ''}
        </div>
      </div>
      <div class="task-actions">
        <button class="icon-btn" data-edit="${t.id}" title="编辑">✎</button>
        <button class="icon-btn del" data-del-task="${t.id}" title="删除">×</button>
      </div>
    </div>`;
}

/* ---------- 记录 ---------- */
function renderLog() {
  const day = getDay();
  const rolls = [...day.rolls].reverse();
  $('#rollList').innerHTML = rolls.length
    ? rolls.map(r => `
        <div class="roll-item">
          <span class="roll-time dim">${fmtClock(r.at)}</span>
          <span class="roll-label">${esc(r.label)}</span>
          <span class="roll-val ${r.value >= 0 ? 'pos' : 'neg'}">${signed(r.value)}</span>
        </div>`).join('')
    : `<div class="dim center" style="padding:20px 0;font-size:13px">今天还没有记录</div>`;

  const days = [];
  for (let i = 6; i >= 0; i--) {
    const d = new Date(); d.setDate(d.getDate() - i);
    const dd = state.days[dateKey(d)];
    days.push({ label: '日一二三四五六'[d.getDay()], score: dd ? calcScore(dd) : 0 });
  }
  const maxAbs = Math.max(10, ...days.map(d => Math.abs(d.score)));
  $('#weekChart').innerHTML = days.map(d => {
    const h = Math.max(3, Math.round(Math.abs(d.score) / maxAbs * 62));
    return `<div class="bar-col">
      <div class="bar-val">${d.score ? d.score : ''}</div>
      <div class="bar-track">
        <div class="bar-fill-v ${d.score >= 0 ? 'pos' : 'neg'}" style="height:${h}px"></div>
      </div>
      <div class="bar-label dim">${d.label}</div>
    </div>`;
  }).join('');
}

/* =========================================================
   任务操作
   ========================================================= */
function addTask() {
  const title = $('#taskTitle').value.trim();
  if (!title) { toast('请输入任务名称'); $('#taskTitle').focus(); return; }

  let minDur = Number($('#taskMin').value) || 5;
  let maxDur = Number($('#taskMax').value) || 60;
  if (minDur < 1) minDur = 1;
  if (maxDur < minDur) maxDur = minDur;

  state.tasks.push({
    id: uid(),
    title,
    category: $('#taskCat').value,
    priority: Number($('#taskPri').value) || 2,
    minDur, maxDur,
    done: false,
    doneAt: null,
    createdAt: Date.now(),
  });
  save();

  $('#taskTitle').value = '';
  $('#taskMin').value = 5;
  $('#taskMax').value = 60;
  renderTasks();
  toast('任务已添加 · 72h 倒计时开始');
}

function deleteTask(id) {
  const t = state.tasks.find(x => x.id === id);
  if (!t) return;
  if (!confirm(`删除任务「${t.title}」？`)) return;
  state.tasks = state.tasks.filter(x => x.id !== id);
  save();
  render();
}

function toggleTaskDone(id) {
  const t = state.tasks.find(x => x.id === id);
  if (!t) return;
  t.done = !t.done;
  t.doneAt = t.done ? Date.now() : null;
  save();
  render();
  toast(t.done ? '任务已完成 ✓' : '已恢复为进行中');
}

function openEditTask(id) {
  const task = state.tasks.find(t => t.id === id);
  if (!task) return;

  const pri = task.priority || 2;

  const modal = document.createElement('div');
  modal.className = 'modal-mask';
  modal.innerHTML = `
    <div class="modal" style="text-align:left">
      <div class="modal-tag" style="text-align:center;display:block;margin-bottom:16px">编 辑 任 务</div>

      <div class="modal-label">标题</div>
      <input id="editTitle" class="input" value="${esc(task.title)}" maxlength="30">

      <div class="row" style="gap:8px">
        <div style="flex:1">
          <div class="modal-label">类别</div>
          <select id="editCat" class="input" style="margin:0">
            ${CATEGORIES.map(c => `<option ${c === task.category ? 'selected' : ''}>${c}</option>`).join('')}
          </select>
        </div>
        <div style="flex:1">
          <div class="modal-label">优先级</div>
          <select id="editPri" class="input" style="margin:0">
            <option value="3" ${pri === 3 ? 'selected' : ''}>高优先</option>
            <option value="2" ${pri === 2 ? 'selected' : ''}>中优先</option>
            <option value="1" ${pri === 1 ? 'selected' : ''}>低优先</option>
          </select>
        </div>
      </div>

      <div class="modal-label" style="margin-top:12px">时长范围（分钟）</div>
      <div class="row" style="gap:6px">
        <input id="editMin" type="number" class="input" value="${task.minDur}" min="1" style="flex:1;margin:0">
        <span class="dim">~</span>
        <input id="editMax" type="number" class="input" value="${task.maxDur}" min="1" style="flex:1;margin:0">
      </div>

      <div class="row gap" style="margin-top:18px">
        <button class="btn ghost" data-m="cancel">取消</button>
        <button class="btn primary" data-m="save">保存</button>
      </div>
    </div>`;
  document.body.appendChild(modal);

  setTimeout(() => {
    const el = modal.querySelector('#editTitle');
    if (el) { el.focus(); el.select(); }
  }, 50);

  modal.addEventListener('click', e => {
    if (e.target === modal) { modal.remove(); return; }
    const btn = e.target.closest('[data-m]');
    if (!btn) return;
    const m = btn.dataset.m;

    if (m === 'cancel') { modal.remove(); return; }

    if (m === 'save') {
      const title = modal.querySelector('#editTitle').value.trim();
      if (!title) { toast('标题不能为空'); return; }

      let minDur = Number(modal.querySelector('#editMin').value) || 5;
      let maxDur = Number(modal.querySelector('#editMax').value) || 60;
      if (minDur < 1) minDur = 1;
      if (maxDur < minDur) maxDur = minDur;

      const newCat = modal.querySelector('#editCat').value;
      const newPri = Number(modal.querySelector('#editPri').value) || 2;

      task.title    = title;
      task.category = newCat;
      task.priority = newPri;
      task.minDur   = minDur;
      task.maxDur   = maxDur;

      const day = getDay();
      day.blocks.forEach(b => {
        if (b.taskId === id && b.status === 'pending') {
          b.title    = title;
          b.category = newCat;
          b.priority = newPri;
        }
      });

      save();
      modal.remove();
      render();
      toast('已保存');
    }
  });
}

/* =========================================================
   拖拽排序
   ========================================================= */
let dragState = null;

function initDragSort() {
  const list = $('#taskListActive');
  if (!list) return;

  // pointerdown 判断是否按在手柄上
  list.addEventListener('pointerdown', e => {
    const handle = e.target.closest('[data-drag-handle]');
    if (!handle) return;
    const item = handle.closest('.task-item');
    if (!item) return;
    const id = item.dataset.taskId;
    if (!id) return;

    e.preventDefault();

    const items = [...list.querySelectorAll('.task-item')];
    const rects = items.map(el => el.getBoundingClientRect());
    const currentIndex = items.indexOf(item);

    // 创建指示线
    list.style.position = 'relative';
    const indicator = document.createElement('div');
    indicator.className = 'drag-indicator';
    list.appendChild(indicator);

    dragState = {
      id, item, list, items, rects,
      pointerId: e.pointerId,
      startY: e.clientY,
      currentIndex,
      targetIndex: currentIndex,
      indicator,
    };

    item.classList.add('dragging');
    item.style.zIndex = '50';

    // 高亮手柄
    handle.style.color = '#5b7cfa';

    updateIndicator();
  });
}

function updateIndicator() {
  if (!dragState) return;
  const { list, items, targetIndex, indicator } = dragState;
  const listTop = list.getBoundingClientRect().top;

  let top;
  if (targetIndex >= items.length) {
    const last = items[items.length - 1];
    top = last.getBoundingClientRect().bottom - listTop;
  } else {
    const el = items[targetIndex];
    top = el.getBoundingClientRect().top - listTop;
  }

  indicator.style.top = top + 'px';
}

function onDragMove(e) {
  if (!dragState || e.pointerId !== dragState.pointerId) return;
  e.preventDefault();

  const dy = e.clientY - dragState.startY;
  dragState.item.style.transform = `translateY(${dy}px)`;

  // 计算插入位置
  const y = e.clientY;
  const { rects } = dragState;
  let target = rects.length;
  for (let i = 0; i < rects.length; i++) {
    const r = rects[i];
    const mid = r.top + r.height / 2;
    if (y < mid) { target = i; break; }
  }

  if (target !== dragState.targetIndex) {
    dragState.targetIndex = target;
    updateIndicator();
  }
}

function onDragEnd(e) {
  if (!dragState || e.pointerId !== dragState.pointerId) return;

  const { item, items, targetIndex, currentIndex, indicator, id, list } = dragState;

  item.classList.remove('dragging');
  item.style.transform = '';
  item.style.zIndex = '';
  if (indicator) indicator.remove();

  // 恢复手柄颜色
  const handle = item.querySelector('[data-drag-handle]');
  if (handle) handle.style.color = '';

  dragState = null;

  // 计算目标位置：如果原位在当前 index 之前，则需要减 1
  let destIndex = targetIndex;
  if (currentIndex < targetIndex) destIndex = targetIndex - 1;

  if (destIndex !== currentIndex) {
    reorderActiveTasks(id, destIndex);
  }
}

function reorderActiveTasks(id, destIndex) {
  const activeTasks = state.tasks.filter(t => !t.done);
  const fromIdx = activeTasks.findIndex(t => t.id === id);
  if (fromIdx === -1) return;

  const [moved] = activeTasks.splice(fromIdx, 1);
  activeTasks.splice(destIndex, 0, moved);

  const doneTasks = state.tasks.filter(t => t.done);
  state.tasks = [...activeTasks, ...doneTasks];

  save();
  renderTasks();
  toast('顺序已保存');
}

/* =========================================================
   日程生成
   ========================================================= */
function pickTask(tasks, lastCat, lastTaskId) {
  const pool = tasks.filter(t => !t.done);
  if (!pool.length) return null;
  const weights = pool.map(t => {
    let w = Number(t.priority) || 2;
    if (t.category !== lastCat) w *= 2;
    if (t.id === lastTaskId)  w *= 0.15;
    return w;
  });
  const total = weights.reduce((a, b) => a + b, 0);
  let r = Math.random() * total;
  for (let i = 0; i < pool.length; i++) {
    r -= weights[i];
    if (r <= 0) return pool[i];
  }
  return pool[pool.length - 1];
}

function generateSchedule(count = 6) {
  if (!state.tasks.filter(t => !t.done).length) {
    toast('先去「任务池」添加至少一个进行中的任务');
    return;
  }
  const day = getDay();
  const pendingCount = day.blocks.filter(b => b.status === 'pending').length;
  if (pendingCount > 0 && !confirm('还有未完成的任务块，重新生成会清空它们。继续？')) return;

  day.blocks = day.blocks.filter(b => b.status === 'done');

  const blocks = [];
  let lastCat = null, lastTaskId = null;
  for (let i = 0; i < count; i++) {
    const pick = pickTask(state.tasks, lastCat, lastTaskId);
    if (!pick) break;
    const dur = randInt(pick.minDur, pick.maxDur);
    blocks.push({
      id: uid(), taskId: pick.id, title: pick.title, category: pick.category,
      priority: pick.priority || 2,
      plannedMin: dur, status: 'pending',
      actualStart: null, actualEnd: null, startRoll: null, endRoll: null,
    });
    lastCat = pick.category;
    lastTaskId = pick.id;
  }
  day.blocks.push(...blocks);
  save(); render();
  toast(`生成了 ${blocks.length} 个随机任务块`);
}

/* =========================================================
   工作块操作
   ========================================================= */
function startBlock(id) {
  const day = getDay();
  if (day.blocks.some(b => b.status === 'active')) { toast('先结束当前工作块'); return; }
  const b = day.blocks.find(x => x.id === id);
  if (!b || b.status !== 'pending') return;

  b.status = 'active';
  b.actualStart = Date.now();
  b._notified = false;

  const st = state.settings;
  const s = randInt(st.startRollMin, st.startRollMax);
  b.startRoll = s;
  pushRoll('start', s, `开始「${b.title}」`);

  save(); render();
  showRollFlash(s, '启动分');
}

function endBlock(id) {
  const day = getDay();
  const b = day.blocks.find(x => x.id === id);
  if (!b || b.status !== 'active') return;

  b.status = 'done';
  b.actualEnd = Date.now();
  b._notified = true;

  const st = state.settings;
  const s = randInt(st.endRollMin, st.endRollMax);
  b.endRoll = s;
  pushRoll('end', s, `完成「${b.title}」`);

  save(); render();
  showRollFlash(s, '完成分');
}

function abortBlock(id) {
  const day = getDay();
  const b = day.blocks.find(x => x.id === id);
  if (!b) return;
  if (!confirm('放弃这个工作块？启动分不会收回，但也不会有完成分。')) return;
  b.status = 'pending';
  b.actualStart = null;
  b._notified = false;
  save(); render();
}

function deleteBlock(id) {
  const day = getDay();
  day.blocks = day.blocks.filter(b => b.id !== id);
  save(); render();
}

function toggleBlockDone(id) {
  const day = getDay();
  const b = day.blocks.find(x => x.id === id);
  if (!b) return;

  if (b.status === 'active') {
    toast('先结束当前工作块');
    return;
  }

  if (b.status === 'done') {
    b.status = 'pending';
    b.actualStart = null;
    b.actualEnd = null;
  } else {
    b.status = 'done';
    b.actualStart = b.actualStart || Date.now();
    b.actualEnd = Date.now();
  }
  save(); render();
}

/* =========================================================
   随时 Roll 工作时长
   ========================================================= */
function rollWorkDuration() {
  const st = state.settings;
  openDurationModal(randInt(st.workMin, st.workMax));
}

function openDurationModal(initial) {
  const st = state.settings;
  let current = initial;

  const modal = document.createElement('div');
  modal.className = 'modal-mask';

  const paint = () => {
    const d = getDay();
    const left = Math.max(0, st.rerollLimit - d.rerolls);
    modal.innerHTML = `
      <div class="modal">
        <div class="modal-tag">随 机 工 作 时 长</div>
        <div class="modal-big">${current}<span class="unit">分钟</span></div>
        <div class="sub dim">今日剩余重摇 ${left} 次</div>
        <div class="row gap" style="margin-top:18px">
          <button class="btn ghost" data-m="reroll" ${left <= 0 ? 'disabled' : ''}>🎲 重摇</button>
          <button class="btn primary" data-m="accept">就它了</button>
        </div>
        <button class="btn text" data-m="cancel">取消</button>
      </div>`;
  };
  paint();
  document.body.appendChild(modal);

  modal.addEventListener('click', e => {
    if (e.target === modal) { modal.remove(); return; }
    const btn = e.target.closest('[data-m]');
    if (!btn) return;
    const m = btn.dataset.m;

    if (m === 'reroll') {
      const d = getDay();
      if (d.rerolls >= st.rerollLimit) return;
      d.rerolls++;
      save();
      current = randInt(st.workMin, st.workMax);
      paint();
    } else if (m === 'accept') {
      modal.remove();
      acceptRandomBlock(current);
    } else {
      modal.remove();
    }
  });
}

function acceptRandomBlock(minutes) {
  const day = getDay();
  const block = {
    id: uid(), taskId: null, title: '随机工作块', category: '随机',
    priority: 2,
    plannedMin: minutes, status: 'pending',
    actualStart: null, actualEnd: null, startRoll: null, endRoll: null, _notified: false,
  };
  const idx = day.blocks.findIndex(b => b.status === 'pending');
  if (idx === -1) day.blocks.push(block);
  else day.blocks.splice(idx, 0, block);
  save(); render();
  toast(`已加入 ${minutes} 分钟工作块`);
}

/* =========================================================
   作息打卡
   ========================================================= */
function habitCheck(kind) {
  const day = getDay();
  const st = state.settings;
  if (day.sleep[kind]) { toast('今天已经打过卡了'); return; }

  const now = new Date();
  const nowMin = now.getHours() * 60 + now.getMinutes();
  const target = kind === 'wake' ? st.wakeTarget : st.sleepTarget;
  const [th, tm] = target.split(':').map(Number);
  const targetMin = th * 60 + tm;

  let diff;
  if (kind === 'wake') {
    diff = nowMin - targetMin;
  } else {
    diff = nowMin < 12 * 60
      ? (nowMin + 1440 - targetMin)
      : (nowMin - targetMin);
  }

  let value;
  if (diff <= 30)       value =  randInt(st.goodSleepMin, st.goodSleepMax);
  else if (diff <= 120) value =  randInt(Math.round(st.goodSleepMin / 2), Math.round(st.goodSleepMax / 2));
  else                  value = -randInt(st.badSleepMin, st.badSleepMax);

  if (value < 0 && !st.enableNegative) value = 0;

  day.sleep[kind] = { at: Date.now(), value, diff };
  const label = kind === 'wake' ? '起床打卡' : '入睡打卡';
  if (value !== 0) {
    const dTxt = diff > 0 ? `晚 ${diff} 分` : `准时`;
    pushRoll(kind, value, `${label}（${dTxt}）`);
  }
  save(); render();
  showRollFlash(value, label);
}

/* =========================================================
   计时器
   ========================================================= */
let tickHandle = null;
function startTick() {
  if (tickHandle) return;
  tickHandle = setInterval(tick, 500);
  tick();
}
function tick() {
  const day = getDay();
  const active = day.blocks.find(b => b.status === 'active');
  if (!active) {
    clearInterval(tickHandle); tickHandle = null; return;
  }
  const el = document.getElementById('liveTimer');
  if (!el) return;

  const sec = Math.floor((Date.now() - active.actualStart) / 1000);
  el.textContent = fmtTimer(sec);

  const bar = document.getElementById('liveBar');
  if (bar) bar.style.width = Math.min(100, (sec / 60) / active.plannedMin * 100) + '%';

  const over = sec / 60 >= active.plannedMin;
  el.classList.toggle('overtime', over);

  if (over && !active._notified) {
    active._notified = true;
    toast('⏰ 计划时间到了，可以结束或继续');
    try { beep(); } catch (e) {}
  }
}

function beep() {
  const Ctx = window.AudioContext || window.webkitAudioContext;
  if (!Ctx) return;
  const ctx = new Ctx();
  const o = ctx.createOscillator(), g = ctx.createGain();
  o.connect(g); g.connect(ctx.destination);
  o.type = 'sine';
  o.frequency.setValueAtTime(880, ctx.currentTime);
  o.frequency.setValueAtTime(1180, ctx.currentTime + 0.12);
  g.gain.setValueAtTime(0.12, ctx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.45);
  o.start(); o.stop(ctx.currentTime + 0.5);
  setTimeout(() => ctx.close(), 900);
}

/* =========================================================
   视觉反馈
   ========================================================= */
function showRollFlash(value, text) {
  const el = document.createElement('div');
  el.className = 'roll-flash ' + (value >= 0 ? 'pos' : 'neg');
  el.innerHTML = `<div class="rf-num">${signed(value)}</div><div class="rf-txt">${esc(text)}</div>`;
  document.body.appendChild(el);
  requestAnimationFrame(() => el.classList.add('show'));
  setTimeout(() => {
    el.classList.remove('show');
    setTimeout(() => el.remove(), 250);
  }, 950);
}

let toastTimer = null;
function toast(msg) {
  let el = document.getElementById('toast');
  if (!el) { el = document.createElement('div'); el.id = 'toast'; document.body.appendChild(el); }
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2000);
}

/* =========================================================
   事件绑定
   ========================================================= */

/* --- 今日页（事件委托） --- */
$('#todayContent').addEventListener('click', e => {
  const toggle = e.target.closest('[data-toggle-block]');
  if (toggle) {
    toggleBlockDone(toggle.dataset.toggleBlock);
    return;
  }

  const btn = e.target.closest('[data-act]');
  if (!btn) return;
  const act = btn.dataset.act;
  const id  = btn.dataset.id;

  switch (act) {
    case 'start':      startBlock(id); break;
    case 'end':        endBlock(id); break;
    case 'abort':      abortBlock(id); break;
    case 'del':        deleteBlock(id); break;
    case 'generate':   generateSchedule(6); break;
    case 'rollDur':    rollWorkDuration(); break;
    case 'habitWake':  habitCheck('wake'); break;
    case 'habitSleep': habitCheck('sleep'); break;
  }
});

/* --- 任务池（事件委托） --- */
$('#view-tasks').addEventListener('click', e => {
  const toggle = e.target.closest('[data-toggle-task]');
  if (toggle) {
    toggleTaskDone(toggle.dataset.toggleTask);
    return;
  }
  const edit = e.target.closest('[data-edit]');
  if (edit) {
    openEditTask(edit.dataset.edit);
    return;
  }
  const del = e.target.closest('[data-del-task]');
  if (del) {
    deleteTask(del.dataset.delTask);
    return;
  }
});

/* --- 添加任务 --- */
$('#btnAddTask').addEventListener('click', addTask);

$('#taskTitle').addEventListener('keydown', e => {
  if (e.key === 'Enter') addTask();
});

/* --- Tabbar --- */
$$('.tabbar button').forEach(btn => {
  btn.addEventListener('click', () => {
    $$('.tabbar button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    $$('.view').forEach(v => v.classList.remove('active'));
    const view = document.getElementById('view-' + btn.dataset.view);
    if (view) view.classList.add('active');
    if (btn.dataset.view === 'log') renderLog();
    if (btn.dataset.view === 'settings') fillSettings();
  });
});

/* --- 设置 --- */
const NUMERIC_SETTINGS = {
  setWorkMin: 'workMin',   setWorkMax: 'workMax',
  setStartMin: 'startRollMin', setStartMax: 'startRollMax',
  setEndMin: 'endRollMin', setEndMax: 'endRollMax',
  setGoodMin: 'goodSleepMin',  setGoodMax: 'goodSleepMax',
  setNegCap: 'negativeDailyCap', setReroll: 'rerollLimit',
};

function fillSettings() {
  const st = state.settings;
  for (const [id, key] of Object.entries(NUMERIC_SETTINGS)) {
    const el = document.getElementById(id);
    if (el) el.value = st[key];
  }
  $('#setWake').value  = st.wakeTarget;
  $('#setSleep').value = st.sleepTarget;
  $('#setNegEnabled').checked = st.enableNegative;
}

function bindSettings() {
  for (const [id, key] of Object.entries(NUMERIC_SETTINGS)) {
    const el = document.getElementById(id);
    if (!el) continue;
    el.addEventListener('change', () => {
      const v = Number(el.value);
      if (!Number.isFinite(v)) { fillSettings(); return; }
      state.settings[key] = Math.max(0, Math.round(v));
      if (key === 'workMin' && state.settings.workMin > state.settings.workMax)
        state.settings.workMax = state.settings.workMin;
      if (key === 'workMax' && state.settings.workMax < state.settings.workMin)
        state.settings.workMin = state.settings.workMax;
      if (key === 'startRollMin' && state.settings.startRollMin > state.settings.startRollMax)
        state.settings.startRollMax = state.settings.startRollMin;
      if (key === 'startRollMax' && state.settings.startRollMax < state.settings.startRollMin)
        state.settings.startRollMin = state.settings.startRollMax;
      if (key === 'endRollMin' && state.settings.endRollMin > state.settings.endRollMax)
        state.settings.endRollMax = state.settings.endRollMin;
      if (key === 'endRollMax' && state.settings.endRollMax < state.settings.endRollMin)
        state.settings.endRollMin = state.settings.endRollMax;
      if (key === 'goodSleepMin' && state.settings.goodSleepMin > state.settings.goodSleepMax)
        state.settings.goodSleepMax = state.settings.goodSleepMin;
      if (key === 'goodSleepMax' && state.settings.goodSleepMax < state.settings.goodSleepMin)
        state.settings.goodSleepMin = state.settings.goodSleepMax;
      save();
      fillSettings();
      render();
    });
  }

  $('#setWake').addEventListener('change',  e => { state.settings.wakeTarget  = e.target.value; save(); render(); });
  $('#setSleep').addEventListener('change', e => { state.settings.sleepTarget = e.target.value; save(); render(); });

  $('#setNegEnabled').addEventListener('change', e => {
    state.settings.enableNegative = e.target.checked;
    save(); render();
  });
}

/* --- 数据 --- */
$('#btnExport').addEventListener('click', () => {
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `rollday-${todayKey()}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
});

$('#btnReset').addEventListener('click', () => {
  if (!confirm('这会清空所有任务、日程、分数和记录，且不可恢复。确定吗？')) return;
  if (!confirm('真的确定？再点一次就没了。')) return;
  localStorage.removeItem(STORAGE_KEY);
  localStorage.removeItem(OLD_STORAGE_KEY);
  location.reload();
});

/* =========================================================
   倒计时刷新（不重排 DOM，避免打断拖拽）
   ========================================================= */
function tickCountdowns() {
  document.querySelectorAll('[data-countdown]').forEach(el => {
    const id = el.dataset.countdown;
    const task = state.tasks.find(t => t.id === id);
    if (!task) return;
    const cd = formatCountdown(task);
    if (!cd) return;
    el.textContent = cd.text;
    el.className = 'cd ' + cd.cls;
  });
}

/* =========================================================
   启动
   ========================================================= */
function init() {
  getDay();
  fillSettings();
  bindSettings();
  render();
  initDragSort();

  // 全局拖拽事件
  document.addEventListener('pointermove', onDragMove, { passive: false });
  document.addEventListener('pointerup', onDragEnd);
  document.addEventListener('pointercancel', onDragEnd);

  // 页面回到前台时刷新
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) {
      render();
      tickCountdowns();
    }
  });

  // 每分钟更新倒计时和分数副标题（不重排列表）
  setInterval(() => {
    tickCountdowns();
    const el = document.getElementById('scoreSub');
    if (el) renderHeader();
  }, 60000);

  // 先跑一次
  tickCountdowns();
}

init();
